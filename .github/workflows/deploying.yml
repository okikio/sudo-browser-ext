name: Deploying

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install pnpm packages
        run: pnpm install

      - name: Build chrome project
        run: pnpm run build

      - name: Package for chrome
        run: pnpm run package

      - name: Build firefox project
        run: pnpm run build:firefox

      - name: Package for firefox
        run: pnpm run package:firefox

      - name: Upload chrome package
        uses: actions/upload-artifact@v4
        with:
          name: chrome
          path: ./build/chrome-mv3-prod.zip

      - name: Upload firefox package
        uses: actions/upload-artifact@v4
        with:
          name: firefox
          path: ./build/firefox-mv3-prod.zip

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Chrome artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome
          path: ./chrome

      - name: Download Firefox artifact
        uses: actions/download-artifact@v4
        with:
          name: firefox
          path: ./firefox

      - name: Get version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Extension v${{ steps.pkg.outputs.version }}
          draft: false
          prerelease: false
          files: |
            ./chrome/chrome-mv3-prod.zip
            ./firefox/firefox-mv3-prod.zip
          token: ${{ secrets.GH_TOKEN }}
